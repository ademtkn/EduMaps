name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Starts local Supabase, applies every migration, writes .env.local and loads the demo data.
      - name: Set up the local stack
        run: bash scripts/setup.sh
      - name: Lint and type check
        run: npm run lint && npm run typecheck
      - name: Unit and database checks
        run: npm run test:i18n && npm run test:import && npm run test:media && npm run test:db
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: |
          npm run e2e:install -- --with-deps
          npm run start:test &
          for i in $(seq 1 60); do curl -fs http://localhost:3100/api/health && break; sleep 2; done
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
